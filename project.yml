name: ClickSplit
options:
  bundleIdPrefix: com.clickplatforms
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  ClickSplit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ClickSplit
      - path: Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.clickplatforms.split
      PRODUCT_NAME: ClickSplit
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Click Split"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_NSCameraUsageDescription: "Click Split needs camera access to scan physical receipts."
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Click Split needs photo library access to upload receipts."
      INFOPLIST_KEY_CFBundleURLTypes:
        - CFBundleURLName: com.clickplatforms.split
          CFBundleURLSchemes:
            - clicksplit
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_VERSION: "6.0"
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""

  ClickSplitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/ClickSplitTests
    dependencies:
      - target: ClickSplit
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "6.0"
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
