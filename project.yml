name: ClickSplit
options:
  bundleIdPrefix: com.clickplatforms
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

targets:
  ClickSplit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ClickSplit
      - path: Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.clickplatforms.split
      PRODUCT_NAME: ClickSplit
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Click Split"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_UIRequiresFullScreen: YES
      INFOPLIST_KEY_NSCameraUsageDescription: "Click Split needs camera access to scan physical receipts."
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Click Split needs photo library access to upload receipts."
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
      INFOPLIST_KEY_CFBundleVersion: "1"
      INFOPLIST_KEY_CFBundleURLTypes:
        - CFBundleURLName: com.clickplatforms.split
          CFBundleURLSchemes:
            - clicksplit
            - click
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      SWIFT_VERSION: "6.0"
      DEVELOPMENT_TEAM: W4C3V9Z2N4
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: Resources/ClickSplit.entitlements

  ClickSplitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/ClickSplitTests
    dependencies:
      - target: ClickSplit
    settings:
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "6.0"
      DEVELOPMENT_TEAM: W4C3V9Z2N4
      CODE_SIGN_STYLE: Automatic
